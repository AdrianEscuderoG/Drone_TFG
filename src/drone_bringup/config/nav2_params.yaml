# nav2_params.yaml — Configuración Nav2 adaptada para dron
#
# NOTA: Nav2 está diseñado para robots terrestres 2D. Para el dron de este TFG
# el control real lo realiza pilot_node (PID custom). Este archivo sirve como
# referencia para futura integración de Nav2 con el sistema aéreo.
#
# Para usar Nav2 con un dron se requiere:
#   - Un costmap 3D o un mapa de ocupación 2D del plano de vuelo.
#   - Adaptar el controlador local (DWB) a la cinemática de un quadrotor.
#   - Publicar /odom desde el nodo de estado con la pose VIO.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5        # m — tolerancia al goal
      use_astar: true       # A* en lugar de Dijkstra
      allow_unknown: true   # permite navegar por zonas sin mapear

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: "nav2_dwb_controller::DWBLocalPlanner"
      # Parámetros adaptados para movimiento omnidireccional del dron
      min_vel_x: -2.0
      min_vel_y: -2.0
      max_vel_x: 2.0
      max_vel_y: 2.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 2.0
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 2.0
      acc_lim_theta: 1.0
      decel_lim_x: -2.0
      decel_lim_y: -2.0
      decel_lim_theta: -1.0
      vx_samples: 10
      vy_samples: 10
      vtheta_samples: 10
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      xy_goal_tolerance: 0.5
      transform_tolerance: 0.2
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "ObstacleFootprint"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      width: 20
      height: 20
      resolution: 0.2
      # Sin footprint para dron (punto)
      robot_radius: 0.4
      rolling_window: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: ""
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.2
      robot_radius: 0.4
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - planner_server
      - controller_server
      - bt_navigator
